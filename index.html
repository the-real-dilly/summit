<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10151A" />
  <title>Summit — Your mountains. Your routes. Your data.</title>
  <style>
    html,body,#root{height:100%;margin:0;background:#10151A}
    /* simple pre-hydration splash so the page isn't blank while Babel compiles */
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      background:#10151A;color:#cfe0d6;font-family:system-ui,sans-serif;z-index:1;transition:opacity .4s}
    #boot .m{text-align:center}
    #boot .s{width:34px;height:34px;border:3px solid #2b3a44;border-top-color:#6fd4ff;border-radius:50%;
      margin:0 auto 14px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <!-- Pinned library versions (cdnjs). React & ReactDOM expose globals; three exposes THREE. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js" crossorigin></script>
</head>
<body>
  <div id="boot"><div class="m"><div class="s"></div><div>Loading Summit…</div></div></div>
  <div id="root"></div>

  <!-- Optional: point the front end at a Summit backend. Leave commented for demo mode. -->
  <!-- <script>window.SUMMIT_API = "https://your-backend.example.com";</script> -->

  <!-- App is compiled in-browser by Babel. For production-grade output use the source project + Vite. -->
  <script type="text/babel" data-presets="react" src="./app.jsx"></script>

  <script>
    // Remove the splash once React has mounted into #root.
    (function () {
      var boot = document.getElementById("boot");
      var tries = 0;
      var iv = setInterval(function () {
        var root = document.getElementById("root");
        if (root && root.childElementCount > 0) {
          boot.style.opacity = "0";
          setTimeout(function () { boot.remove(); }, 400);
          clearInterval(iv);
        } else if (++tries > 200) { // ~20s safety
          clearInterval(iv);
        }
      }, 100);
    })();
  </script>
</body>
</html>
